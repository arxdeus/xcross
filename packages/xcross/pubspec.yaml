name: xcross
description: >-
  Build, run, and hot-reload Flutter iOS apps natively from Linux and Windows
  with official Swift and LLVM toolchains and no xtool runtime.
version: 1.3.1
repository: https://github.com/arxdeus/xcross
homepage: https://github.com/arxdeus/xcross
topics:
  - ios
  - flutter
  - cli
  - cross-compilation

environment:
  sdk: ^3.10.0

resolution: workspace

executables:
  xcross:
  xcrun:

dependencies:
  archive: ^4.2.0
  args: ^2.7.0
  async: ^2.13.1
  completion: ^1.0.2
  cli_util: ^0.5.2
  meta: ^1.19.0
  package_config: ^3.0.0
  path: ^1.9.1
  standard_message_codec: ^0.0.1+5
  yaml: ^3.1.3
  web_socket_channel: ^3.0.3
  posix: ^6.5.2
  basic_utils: ^5.8.2
  http: ^1.6.0
  xml: ^7.0.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  pointycastle: ^4.0.0
  propertylistserialization: ^1.5.0
  build_cli_annotations: ^2.1.1
  pure: ^1.0.0
  dds: ^5.4.0
  vm_service: ^15.2.0

  apple_developer_kit: ^1.0.0
  cli_kit: ^1.0.0
  darwin_sdk_kit: ^1.0.0
  dart_mobile_device: ^1.0.0
  frontend_server_kit: ^1.0.0
  embed_annotation: ^1.2.3

dev_dependencies:
  build_cli: ^2.2.13
  build_runner: ^2.16.0
  embed: ^1.6.6
  test: ^1.31.2
