name: Integration Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFT_VERSION: 6.3.3
  SWIFT_WINDOWS_SHA256: >-
    235626548F249CD516D3D4D90EEE980DCCAD46F3822DAC1F8E3119B0FEDE94B7

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-build:
    # Fork PR code must never receive the private Apple SDK cache.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Flutter and Compose SwiftPM build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Use JDK 21 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Use JDK 21 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:JAVA_HOME_21_X64) {
            throw 'JAVA_HOME_21_X64 is not available on this runner'
          }
          "JAVA_HOME=$env:JAVA_HOME_21_X64" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:JAVA_HOME_21_X64\bin" |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:JAVA_HOME_21_X64\bin\java.exe" -version

      - name: Install Flutter on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch stable \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone `
            --depth 1 `
            --branch stable `
            https://github.com/flutter/flutter.git `
            "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux requirements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter precache --ios
          dart pub get
          (cd packages/xcross && dart build cli -t bin/xcross.dart)
          cp -r packages/xcross/build/cli/*/bundle "$RUNNER_TEMP/xcross-bundle"
          chmod +x "$RUNNER_TEMP/xcross-bundle/bin/xcross"
          "$RUNNER_TEMP/xcross-bundle/bin/xcross" setup
          sudo apt-get install -y llvm
          tools=(
            swift clang clang++ llvm-ar ld64.lld
            llvm-readobj llvm-nm llvm-objdump
          )
          for tool in "${tools[@]}"; do command -v "$tool"; done

      - name: Install official Swift and LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          $release = "swift-$env:SWIFT_VERSION-release"
          $version = "swift-$env:SWIFT_VERSION-RELEASE"
          $base = 'https://download.swift.org'
          $url = "$base/$release/windows10/$version/" +
            "$version-windows10.exe"
          Invoke-WebRequest $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:SWIFT_WINDOWS_SHA256) {
            throw "Swift installer checksum mismatch: $hash"
          }
          $process = Start-Process `
            $installer `
            -ArgumentList '/quiet', '/norestart' `
            -PassThru `
            -Wait
          if ($process.ExitCode -notin 0, 3010) {
            throw "Swift installer failed: $($process.ExitCode)"
          }

          $llvmBin = "${env:ProgramFiles}\LLVM\bin"
          if (-not (Test-Path "$llvmBin\ld64.lld.exe")) {
            throw "Hosted-runner LLVM missing ld64.lld.exe at $llvmBin"
          }
          $swiftRoot = "$env:LOCALAPPDATA\Programs\Swift"
          # The installer registers its Runtimes, Toolchains, and Tools
          # directories in the persisted PATH, but this job's environment
          # predates the install. swift.exe cannot even start without the
          # Runtimes DLLs, and Windows reports that as a bare exit code
          # 3221225781 (0xC0000135, STATUS_DLL_NOT_FOUND), so re-export every
          # directory the installer registered under the Swift root.
          $swiftDirs = @(
            [Environment]::GetEnvironmentVariable('Path', 'Machine')
            [Environment]::GetEnvironmentVariable('Path', 'User')
          ) -join ';' -split ';' |
            Where-Object { $_ } |
            ForEach-Object { $_.TrimEnd('\') } |
            Where-Object { $_ -like "$swiftRoot*" } |
            Select-Object -Unique
          $swift = Get-ChildItem `
            "$swiftRoot\Toolchains" `
            -Filter swift.exe `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $swift) {
            throw 'Swift.Toolchain did not install swift.exe'
          }
          $runtime = Get-ChildItem `
            "$swiftRoot\Runtimes" `
            -Filter swiftCore.dll `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $runtime) {
            throw 'Swift.Runtime did not install swiftCore.dll'
          }
          $swiftDirs = @(
            (Split-Path $runtime.FullName)
            (Split-Path $swift.FullName)
          ) + $swiftDirs | Select-Object -Unique
          $swiftDirs | ForEach-Object { "  $_" } | Write-Host
          $llvmBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $swiftDirs | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$llvmBin;$($swiftDirs -join ';');$env:Path"
          # SDKROOT is registered by the installer too, and it is what swiftc
          # defaults `-sdk` to for *host* compiles. SwiftPM compiles every
          # Package.swift manifest for the host before it ever looks at
          # `--swift-sdk`, so without SDKROOT the cross build dies with
          # "unable to load standard library for target
          # 'x86_64-unknown-windows-msvc'".
          $sdkRoot = @(
            [Environment]::GetEnvironmentVariable('SDKROOT', 'User')
            [Environment]::GetEnvironmentVariable('SDKROOT', 'Machine')
          ) | Where-Object { $_ } | Select-Object -First 1
          if (-not $sdkRoot) {
            $sdkRoot = Get-ChildItem `
              "$swiftRoot\Platforms" `
              -Filter Windows.sdk `
              -Directory `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $sdkRoot -or -not (Test-Path $sdkRoot)) {
            throw 'Swift.Platform did not install a Windows SDK (SDKROOT)'
          }
          Write-Host "  SDKROOT=$sdkRoot"
          "SDKROOT=$sdkRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SDKROOT = $sdkRoot
          $tools = @(
            'swift', 'clang', 'clang++', 'llvm-ar', 'ld64.lld',
            'llvm-readobj', 'llvm-nm', 'llvm-objdump'
          )
          foreach ($tool in $tools) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing $tool"
            }
          }
          # Runs swift.exe and the swift-sdk.exe subcommand binary, so a
          # broken toolchain fails here instead of in a later step.
          & swift --version
          if ($LASTEXITCODE -ne 0) {
            throw "swift --version failed with $LASTEXITCODE"
          }
          & swift sdk list
          if ($LASTEXITCODE -ne 0) {
            throw "swift sdk list failed with $LASTEXITCODE"
          }
          # Neither command above loads the standard library, so type-check a
          # trivial file to prove SDKROOT actually resolves one.
          $probe = "$env:RUNNER_TEMP\swift-probe.swift"
          Set-Content $probe 'print("ok")' -Encoding utf8
          & swiftc -typecheck $probe
          if ($LASTEXITCODE -ne 0) {
            throw "Host Swift stdlib unusable (SDKROOT=$env:SDKROOT)"
          }

          flutter config --no-analytics
          flutter precache --ios
          dart pub get
          Push-Location packages/xcross
          dart build cli -t bin/xcross.dart
          Pop-Location
          Copy-Item -Recurse `
            packages/xcross/build/cli/windows_x64/bundle `
            "$env:RUNNER_TEMP\xcross-bundle"
          & "$env:RUNNER_TEMP\xcross-bundle\bin\xcross.exe" setup

      - name: Restore cached Darwin SDK
        uses: ./.github/actions/setup-darwin-sdk

      - name: Build Compose smoke examples on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          xcross="$RUNNER_TEMP/xcross-bundle/bin/xcross"
          cd "$GITHUB_WORKSPACE/examples/compose_app"
          "$xcross" compose setup
          "$xcross" compose build
          cd "$GITHUB_WORKSPACE/examples/kmp_swift_app"
          "$xcross" compose build
          cd "$GITHUB_WORKSPACE"
          test -f examples/compose_app/build/xcross-ios/ComposeApp.app/Runner
          test -f examples/kmp_swift_app/build/xcross-ios/KmpSwiftApp.app/Runner

      - name: Inspect Compose smoke examples on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The build pipeline itself gates on Mach-O validity
          # (MachOValidator.validate64BitExecutable) and Info.plist/framework
          # presence (ComposeAppAssembler._validateStagedApp) before ever
          # writing an .app, and both are unit-tested. This step is the
          # independent, external half of that acceptance criterion: verify
          # the actual bundles CI just produced, the same way the Flutter
          # plugin sample below is inspected, rather than trusting the
          # internal gate alone.
          declare -A apps=(
            [examples/compose_app/build/xcross-ios/ComposeApp.app]=ComposeApp
            [examples/kmp_swift_app/build/xcross-ios/KmpSwiftApp.app]=Shared
          )
          for app in "${!apps[@]}"; do
            base=${apps[$app]}
            runner="$app/Runner"
            plist="$app/Info.plist"
            framework="$app/Frameworks/$base.framework/$base"
            test -f "$runner"
            test -f "$plist"
            test -f "$framework"
            llvm-readobj --file-headers "$runner" | tee "$(basename "$app")-runner-headers.txt"
            grep -Eq 'Format: Mach-O arm64|Arch: aarch64' "$(basename "$app")-runner-headers.txt"
            flatplist=$(tr '\n\t' '  ' < "$plist")
            echo "$flatplist" | grep -Eq '<key>CFBundleExecutable</key>[[:space:]]*<string>Runner</string>' || {
              echo "Info.plist missing CFBundleExecutable=Runner: $plist" >&2
              exit 1
            }
            echo "$flatplist" | grep -Eq '<key>CFBundleIdentifier</key>' || {
              echo "Info.plist missing CFBundleIdentifier: $plist" >&2
              exit 1
            }
          done

      - name: Build Compose smoke examples on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xcross = "$env:RUNNER_TEMP\xcross-bundle\bin\xcross.exe"
          Set-Location "$env:GITHUB_WORKSPACE\examples\compose_app"
          & $xcross compose setup
          if ($LASTEXITCODE -ne 0) { throw 'xcross compose setup failed' }
          & $xcross compose build
          if ($LASTEXITCODE -ne 0) { throw 'xcross compose build compose_app failed' }
          Set-Location "$env:GITHUB_WORKSPACE\examples\kmp_swift_app"
          & $xcross compose build
          if ($LASTEXITCODE -ne 0) { throw 'xcross compose build kmp_swift_app failed' }
          Set-Location $env:GITHUB_WORKSPACE
          $outputs = @(
            'examples/compose_app/build/xcross-ios/ComposeApp.app/Runner',
            'examples/kmp_swift_app/build/xcross-ios/KmpSwiftApp.app/Runner'
          )
          foreach ($output in $outputs) {
            if (-not (Test-Path $output -PathType Leaf)) {
              throw "Missing $output"
            }
          }

      - name: Inspect Compose smoke examples on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # See the matching Linux step's comment: the build pipeline
          # already gates Mach-O validity and Info.plist/framework presence
          # internally (and both are unit-tested); this is the independent,
          # external verification of the bundles this job just produced.
          $apps = @{
            'examples/compose_app/build/xcross-ios/ComposeApp.app' = 'ComposeApp'
            'examples/kmp_swift_app/build/xcross-ios/KmpSwiftApp.app' = 'Shared'
          }
          foreach ($app in $apps.Keys) {
            $base = $apps[$app]
            $runner = Join-Path $app 'Runner'
            $plist = Join-Path $app 'Info.plist'
            $framework = Join-Path $app "Frameworks/$base.framework/$base"
            if (-not (Test-Path $runner -PathType Leaf)) {
              throw "Missing $runner"
            }
            if (-not (Test-Path $plist -PathType Leaf)) {
              throw "Missing $plist"
            }
            if (-not (Test-Path $framework -PathType Leaf)) {
              throw "Missing $framework"
            }
            $headers = (& llvm-readobj --file-headers $runner | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'llvm-readobj failed' }
            $isMachO = $headers -match 'Format:\s+Mach-O arm64'
            $isArm64 = $headers -match 'Arch:\s+aarch64'
            if (-not $isMachO -and -not $isArm64) {
              throw "Runner is not ARM64 Mach-O:`n$headers"
            }
            $plistText = Get-Content $plist -Raw
            if ($plistText -notmatch '<key>CFBundleExecutable</key>\s*<string>Runner</string>') {
              throw "Info.plist missing CFBundleExecutable=Runner:`n$plistText"
            }
            if ($plistText -notmatch '<key>CFBundleIdentifier</key>') {
              throw "Info.plist missing CFBundleIdentifier:`n$plistText"
            }
          }

      - name: Create and build plugin sample on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --platforms=ios \
            --org com.example.xcrossci \
            --project-name xcross_ci_sample \
            "$RUNNER_TEMP/flutter_sample"
          cd "$RUNNER_TEMP/flutter_sample"
          fixture="$GITHUB_WORKSPACE/packages/xcross/test/flutter/fixtures/spm_plugin"
          flutter pub add "spm_plugin@{path: $fixture}"
          "$RUNNER_TEMP/xcross-bundle/bin/xcross" flutter build

      - name: Create and build plugin sample on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sample = "$env:RUNNER_TEMP\flutter_sample"
          flutter create `
            --platforms=ios `
            --org com.example.xcrossci `
            --project-name xcross_ci_sample `
            $sample
          Set-Location $sample
          $fixturePath = Resolve-Path `
            "$env:GITHUB_WORKSPACE/packages/xcross/test/flutter/fixtures/spm_plugin"
          $fixture = $fixturePath.Path.Replace('\', '/')
          $descriptor = 'spm_plugin@{path: ' + $fixture + '}'
          flutter pub add -- $descriptor
          & "$env:RUNNER_TEMP\xcross-bundle\bin\xcross.exe" flutter build

      - name: Inspect app and plugin library on Linux
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/flutter_sample
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(build/xcross-ios/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            printf 'Expected one .app, found %s\n' "${#apps[@]}"
            exit 1
          fi
          app=${apps[0]}
          runner="$app/Runner"
          plugins="$app/Frameworks/libFlutterPluginsGenerated.dylib"
          dependency="$app/Frameworks/libspm-plugin.dylib"
          test -f "$runner"
          test -f "$plugins"
          test -f "$dependency"

          llvm-readobj --file-headers "$runner" | tee runner-headers.txt
          grep -Eq 'Format: Mach-O arm64|Arch: aarch64' runner-headers.txt
          llvm-nm \
            --defined-only \
            --extern-only \
            "$plugins" | tee plugin-symbols.txt
          grep -F XcrossRegisterGeneratedPlugins plugin-symbols.txt
          llvm-objdump \
            --macho \
            --dylibs-used \
            "$plugins" | tee plugin-dylibs.txt
          grep -F '@rpath/libspm-plugin.dylib' plugin-dylibs.txt
          llvm-objdump --macho --dylib-id "$dependency" |
            grep -F '@rpath/libspm-plugin.dylib'
          llvm-objdump --macho --dylibs-used "$runner" | tee runner-dylibs.txt
          grep -F '@rpath/libFlutterPluginsGenerated.dylib' runner-dylibs.txt
          llvm-objdump \
            --macho \
            --private-headers \
            "$runner" | tee runner-load-commands.txt
          grep -F '@executable_path/Frameworks' runner-load-commands.txt

      - name: Inspect app and plugin library on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/flutter_sample
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(Get-ChildItem build/xcross-ios -Directory -Filter *.app)
          if ($apps.Count -ne 1) {
            throw "Expected one .app, found $($apps.Count)"
          }
          $runner = Join-Path $apps[0].FullName 'Runner'
          $plugins = Join-Path `
            $apps[0].FullName `
            'Frameworks/libFlutterPluginsGenerated.dylib'
          $dependency = Join-Path `
            $apps[0].FullName `
            'Frameworks/libspm-plugin.dylib'
          if (-not (Test-Path $runner -PathType Leaf)) {
            throw "Missing $runner"
          }
          if (-not (Test-Path $plugins -PathType Leaf)) {
            throw "Missing $plugins"
          }
          if (-not (Test-Path $dependency -PathType Leaf)) {
            throw "Missing $dependency"
          }

          $headers = (& llvm-readobj --file-headers $runner | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'llvm-readobj failed' }
          $isMachO = $headers -match 'Format:\s+Mach-O arm64'
          $isArm64 = $headers -match 'Arch:\s+aarch64'
          if (-not $isMachO -and -not $isArm64) {
            throw "Runner is not ARM64 Mach-O:`n$headers"
          }
          $symbols = (& llvm-nm `
            --defined-only `
            --extern-only `
            $plugins | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $symbols -notmatch 'XcrossRegisterGeneratedPlugins') {
            throw "Missing exported plugin registrant:`n$symbols"
          }
          $pluginDylibs = (& llvm-objdump `
            --macho `
            --dylibs-used `
            $plugins | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $pluginDylibs -notmatch '@rpath/libspm-plugin\.dylib') {
            throw "Missing dynamic plugin dependency:`n$pluginDylibs"
          }
          $dependencyId = (& llvm-objdump `
            --macho `
            --dylib-id `
            $dependency | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $dependencyId -notmatch '@rpath/libspm-plugin\.dylib') {
            throw "Invalid dynamic plugin ID:`n$dependencyId"
          }
          $dylibs = (& llvm-objdump `
            --macho `
            --dylibs-used `
            $runner | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $dylibs -notmatch '@rpath/libFlutterPluginsGenerated\.dylib') {
            throw "Missing plugin load command:`n$dylibs"
          }
          $commands = (& llvm-objdump `
            --macho `
            --private-headers `
            $runner | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $commands -notmatch '@executable_path/Frameworks') {
            throw "Missing Frameworks rpath:`n$commands"
          }
