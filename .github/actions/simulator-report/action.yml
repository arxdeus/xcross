name: Simulator report
description: >-
  Publish staged simulator screenshots to the hidden refs/ci/simulator-reports
  ref (not a branch, so it never shows up in the branch list) and write one run
  summary that shows every Flutter and Compose screenshot inline.

inputs:
  staged:
    description: Directory holding the downloaded simulator-report-* artifacts.
    required: true
  title:
    description: Summary heading.
    required: true
  pr:
    description: Pull request to post the report on; earlier reports there are marked outdated.
    required: false
    default: ''
  sha:
    description: xcross commit the run checked out.
    required: true

runs:
  using: composite
  steps:
    - name: Publish screenshots
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STAGED: ${{ inputs.staged }}
        TITLE: ${{ inputs.title }}
        REPORT_PATH: ${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}
      run: |
        set -euo pipefail
        ref=refs/ci/simulator-reports
        work="$RUNNER_TEMP/simulator-reports"
        rm -rf "$work"
        git init -q "$work"
        git -C "$work" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if git -C "$work" fetch -q --depth 1 origin "$ref"; then
          git -C "$work" checkout -q -B reports FETCH_HEAD
        else
          git -C "$work" checkout -q --orphan reports
        fi
        python3 .github/scripts/simulator_report.py "$STAGED" --title "$TITLE" \
          --publish-dir "$work/$REPORT_PATH"
        if [ -z "$(git -C "$work" status --porcelain)" ]; then
          echo "published=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git -C "$work" add -A
        git -C "$work" -c user.name=github-actions -c user.email=actions@github.com \
          commit -q -m "simulator screenshots for run ${REPORT_PATH}"
        for attempt in 1 2 3; do
          if git -C "$work" push -q origin "HEAD:$ref"; then
            commit=$(git -C "$work" rev-parse HEAD)
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "base=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${commit}/${REPORT_PATH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$work" fetch -q --depth 1 origin "$ref"
          git -C "$work" rebase -q FETCH_HEAD
        done
        echo "::warning::Could not publish simulator screenshots"
        echo "published=false" >> "$GITHUB_OUTPUT"

    - name: Resolve the xcross_examples commit
      id: examples
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        if submodule=$(gh api "repos/${GITHUB_REPOSITORY}/contents/examples?ref=${SHA}"); then
          echo "sha=$(jq -r '.sha // empty' <<< "$submodule")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.submodule_git_url // empty' <<< "$submodule")" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not resolve the examples submodule commit"
        fi

    - name: Write run summary
      shell: bash
      env:
        STAGED: ${{ inputs.staged }}
        TITLE: ${{ inputs.title }}
        PUBLISHED: ${{ steps.publish.outputs.published }}
        BASE: ${{ steps.publish.outputs.base }}
        SHA: ${{ inputs.sha }}
        REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        EXAMPLES_SHA: ${{ steps.examples.outputs.sha }}
        EXAMPLES_URL: ${{ steps.examples.outputs.url }}
      run: |
        set -euo pipefail
        args=(--title "$TITLE" --commit "$SHA" --repository-url "$REPOSITORY_URL"
          --examples-commit "$EXAMPLES_SHA" --examples-url "$EXAMPLES_URL")
        if [ "$PUBLISHED" = true ]; then
          args+=(--image-base "$BASE")
        fi
        python3 .github/scripts/simulator_report.py "$STAGED" "${args[@]}" > "$RUNNER_TEMP/simulator-report.md"

    - name: Post report on the pull request
      if: inputs.pr != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        { cat "$RUNNER_TEMP/simulator-report.md"; echo; echo "[Full run]($RUN_URL)"; } > "$RUNNER_TEMP/simulator-comment.md"
        python3 .github/scripts/report_comment.py --repository "$GITHUB_REPOSITORY" --pr "$PR" \
          --body-file "$RUNNER_TEMP/simulator-comment.md"
