name: xcross
description: >-
  Build, run, and hot-reload Flutter iOS apps from Linux without Xcode, by
  driving the xtool CLI for sign/install and re-implementing the
  Flutter build + iOS 17 CoreDevice launch pipeline in Dart.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  archive: ^4.0.9
  args: ^2.7.0
  async: ^2.13.1
  completion: ^1.0.2
  cli_util: ^0.5.2
  meta: ^1.19.0
  path: ^1.9.1
  standard_message_codec: ^0.0.1+5
  yaml: ^3.1.3
  web_socket_channel: ^3.0.3
  posix: ^6.5.2
  dds: ^5.4.0
  vm_service: ">=15.2.0"
  package_config: ^3.0.0
  basic_utils: ^5.8.2
  http: ^1.6.0
  xml: ^7.0.1

dev_dependencies:
  test: ^1.31.2
