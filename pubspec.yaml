name: xcross_workspace
description: >-
  Workspace root for xcross — the CLI lives in packages/xcross.
version: 1.3.3
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/xcross
  - packages/cli_kit
  - packages/apple_developer_kit
  - packages/darwin_sdk_kit
  - packages/dart_mobile_device
  - packages/frontend_server_kit
