name: xcross
description: >-
  Build, run, and hot-reload Flutter iOS apps from Linux without Xcode, by
  driving the xtool CLI for sign/install and re-implementing the
  Flutter build + iOS 17 CoreDevice launch pipeline in Dart.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  archive: ^4.0.9
  args: ^2.7.0
  async: ^2.13.1
  completion: ^1.0.2
  cli_util: ^0.5.2
  meta: ^1.19.0
  path: ^1.9.1
  yaml: ^3.1.3
  web_socket_channel: ^3.0.3
  posix: ^6.5.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
