name: Setup Darwin SDK
description: >-
  Restore xcross-darwin.artifactbundle from the host-specific cache, or
  download it from the private artifactbundle URL.

inputs:
  artifactbundle-url:
    description: >-
      Private URL to a .tar.gz containing xcross-darwin.artifactbundle at its
      root. Optional when the host-specific cache is warm.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve xcross Swift SDK path
      shell: python
      run: |
        import os
        from pathlib import Path

        if os.name == "nt":
            config = Path(os.environ["APPDATA"])
        else:
            config = Path(os.environ.get("XDG_CONFIG_HOME", Path.home() / ".config"))
        parent = config / "xcross" / "swift-sdks"
        bundle = parent / "xcross-darwin.artifactbundle"
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"XCROSS_SWIFT_SDKS_PATH={parent}\n")
            env.write(f"XCROSS_DARWIN_BUNDLE={bundle}\n")

    - name: Restore Darwin SDK cache
      id: darwin-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ env.XCROSS_DARWIN_BUNDLE }}
        key: xcross-darwin-artifactbundle-v2-${{ runner.os }}-${{ runner.arch }}

    - name: Download Darwin SDK (cache miss)
      if: steps.darwin-cache.outputs.cache-hit != 'true'
      shell: python
      env:
        DARWIN_ARTIFACTBUNDLE_URL: ${{ inputs.artifactbundle-url }}
      run: |
        import os
        import shutil
        import subprocess
        import urllib.request
        from pathlib import Path

        url = os.environ.get("DARWIN_ARTIFACTBUNDLE_URL", "")
        if not url:
            print("::error::Darwin SDK cache miss. Run the Warm Darwin SDK cache workflow for this runner OS/architecture, or pass its private artifact URL.")
            raise SystemExit(1)

        parent = Path(os.environ["XCROSS_SWIFT_SDKS_PATH"])
        bundle = Path(os.environ["XCROSS_DARWIN_BUNDLE"])
        archive = Path(os.environ["RUNNER_TEMP"]) / "xcross-darwin.artifactbundle.tar.gz"
        parent.mkdir(parents=True, exist_ok=True)
        if bundle.exists():
            shutil.rmtree(bundle)
        print("Downloading private Darwin SDK archive...")
        with urllib.request.urlopen(url) as response, archive.open("wb") as output:
            shutil.copyfileobj(response, output)
        subprocess.run(["tar", "-xzf", str(archive), "-C", str(parent)], check=True)
        archive.unlink()
        if not (bundle / "info.json").is_file():
            print("::error::Archive must contain xcross-darwin.artifactbundle at its root.")
            raise SystemExit(1)

    - name: Refresh clang builtin headers
      shell: python
      run: |
        import os
        import shutil
        import subprocess
        from pathlib import Path

        resource = Path(subprocess.check_output(["clang", "-print-resource-dir"], text=True).strip())
        source = resource / "include"
        destination = Path(os.environ["XCROSS_DARWIN_BUNDLE"]) / "Developer" / "Toolchains" / "XcodeDefault.xctoolchain" / "usr" / "lib" / "swift" / "clang" / "include"
        if not source.is_dir():
            raise SystemExit(f"clang builtin headers not found at {source}")
        if destination.is_symlink() or destination.is_file():
            destination.unlink()
        elif destination.exists():
            shutil.rmtree(destination)
        destination.parent.mkdir(parents=True, exist_ok=True)
        shutil.copytree(source, destination)

    - name: Verify Darwin Swift SDK
      shell: python
      run: |
        import os
        import subprocess
        from pathlib import Path

        parent = Path(os.environ["XCROSS_SWIFT_SDKS_PATH"])
        bundle = Path(os.environ["XCROSS_DARWIN_BUNDLE"])
        for name in ("info.json", "swift-sdk.json"):
            if not (bundle / name).is_file():
                raise SystemExit(f"missing {bundle / name}")
        subprocess.run(["swift", "sdk", "list", "--swift-sdks-path", str(parent)], check=True)
