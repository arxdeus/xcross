name: xcross_flutter
description: >-
  Build Flutter iOS app bundles on Linux/Windows and drive hot reload over a
  device tunnel.
version: 0.1.0
repository: https://github.com/arxdeus/xcross
homepage: https://github.com/arxdeus/xcross
topics:
  - flutter
  - ios
  - hot-reload

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  archive: ^4.0.9
  async: ^2.13.1
  cli_kit:
    path: ../cli_kit
  darwin_sdk_kit:
    path: ../darwin_sdk_kit
  dart_mobile_device:
    path: ../dart_mobile_device
  frontend_server_kit:
    path: ../frontend_server_kit
  meta: ^1.19.0
  path: ^1.9.1
  standard_message_codec: ^0.0.1+5
  web_socket_channel: ^3.0.3
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
