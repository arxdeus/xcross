name: Release xcross

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned toolchain that builds the bundled OpenAppleMacrosServer. Keep in
  # sync with integration.yml.
  SWIFT_VERSION: 6.4.0
  SWIFT_WINDOWS_X64_SHA256: >-
    76169A85BCBA82854A0CD8F9655FFB74B3758D60C35A245457510095F2823C03
  SWIFT_WINDOWS_ARM64_SHA256: >-
    F48E393634995CB589F547E40D64673BC641CA76B099697BA8227A8904BE4A49

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Required to sign the SLSA provenance attestation with the run's OIDC
      # identity, proving the archive came out of this workflow at this commit.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: xcross-linux-x64
          - runner: ubuntu-24.04-arm
            asset: xcross-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      # Run each package from its own directory: `dart test <path>` from the
      # workspace root does not run that package's build hooks, so native
      # assets (the ADI bridge) would be missing.
      - name: Test
        run: |
          set -euo pipefail
          for package in xcross cli_kit apple_developer_kit darwin_sdk_kit \
            dart_mobile_device frontend_server_kit; do
            (cd "packages/$package" && dart test)
          done

      - name: Validate pub.dev package
        working-directory: packages/xcross
        run: dart pub publish --dry-run

      - name: Set up Swift
        uses: ./.github/actions/setup-swift
        with:
          version: ${{ env.SWIFT_VERSION }}
          windows-x64-sha256: ${{ env.SWIFT_WINDOWS_X64_SHA256 }}
          windows-arm64-sha256: ${{ env.SWIFT_WINDOWS_ARM64_SHA256 }}

      - name: Build xcross
        working-directory: packages/xcross
        env:
          XCROSS_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'unreleased' }}
          XCROSS_BUILD_RELEASED: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: >-
          dart run
          "-DXCROSS_VERSION=${XCROSS_BUILD_VERSION}"
          "-DXCROSS_RELEASED=${XCROSS_BUILD_RELEASED}"
          -DXCROSS_BUNDLE_MACROS=true
          tool/build_xcross.dart

      - name: Smoke-test bundled OpenAppleMacrosServer
        run: bash .github/scripts/smoke_open_apple_macros.sh packages/xcross/build/cli/*/bundle

      - name: Compile binary
        run: |
          mkdir -p dist
          # Bundle layout is bin/ + lib/ (native assets and the macro
          # server) plus third-party notices. Ship as tar.gz.
          bundle=$(echo packages/xcross/build/cli/*/bundle)
          mkdir -p "$bundle/THIRD_PARTY_LICENSES"
          cp third_party/OpenAppleMacros/LICENSE.md \
            "$bundle/THIRD_PARTY_LICENSES/OpenAppleMacros.txt"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/swiftlang/swift/main/LICENSE.txt \
            -o "$bundle/THIRD_PARTY_LICENSES/swift.txt"
          tar -C "$bundle" \
            -czf "dist/${{ matrix.asset }}.tar.gz" bin lib THIRD_PARTY_LICENSES

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.1
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/${{ matrix.asset }}.tar.gz

      - name: Upload binary artifacts
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            asset: xcross-windows-x64
            architecture: x64
            cli-dir: windows_x64
          - runner: windows-11-arm
            asset: xcross-windows-arm64
            architecture: arm64
            cli-dir: windows_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      # Pin the SDK architecture: the AOT executable and the native bridge are
      # built for the architecture of the Dart SDK that runs the build, so an
      # emulated x64 SDK on the ARM64 runner would silently ship x64 binaries.
      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable
          architecture: ${{ matrix.architecture }}

      # The Windows ADI bridge is compiled by a Dart build hook through
      # native_toolchain_c, which resolves MSVC with `vswhere -requires
      # Microsoft.VisualStudio.Component.VC.Tools.<arch>`. Verify that query
      # succeeds and add the component when the runner image lacks it.
      - name: Ensure MSVC tools
        shell: pwsh
        env:
          MSVC_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $component = switch ($env:MSVC_ARCHITECTURE) {
            'x64' { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
            'arm64' { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' }
            default { throw "Unsupported MSVC architecture: $env:MSVC_ARCHITECTURE" }
          }
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          function Find-Msvc {
            & $vswhere -latest -products '*' -requires $component `
              -property installationPath
          }
          $installation = Find-Msvc
          if (-not $installation) {
            $visualStudio = & $vswhere -latest -products '*' -property installationPath
            if (-not $visualStudio) {
              throw 'No Visual Studio installation found on this runner'
            }
            Write-Host "Adding $component to $visualStudio"
            $process = Start-Process `
              (Join-Path $installerDir 'vs_installer.exe') `
              -ArgumentList 'modify', '--installPath', "`"$visualStudio`"", `
                '--add', $component, '--quiet', '--norestart', '--nocache' `
              -PassThru `
              -Wait
            if ($process.ExitCode -notin 0, 3010) {
              throw "Visual Studio installer failed: $($process.ExitCode)"
            }
            $installation = Find-Msvc
            if (-not $installation) {
              throw "$component is still missing after installation"
            }
          }
          Write-Host "MSVC ${env:MSVC_ARCHITECTURE} tools: $installation"

      # bash, not the pwsh default: GitHub only propagates $LASTEXITCODE from
      # the final line of a pwsh `run` block, so a failing `dart test` on any
      # earlier line is silently swallowed and the job reports success. bash
      # with `set -e` fails the step on the first non-zero command.
      - name: Verify Dart code
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          for package in xcross cli_kit apple_developer_kit darwin_sdk_kit \
            dart_mobile_device frontend_server_kit; do
            (cd "packages/$package" && dart test)
          done

      - name: Set up Swift
        uses: ./.github/actions/setup-swift
        with:
          version: ${{ env.SWIFT_VERSION }}
          windows-x64-sha256: ${{ env.SWIFT_WINDOWS_X64_SHA256 }}
          windows-arm64-sha256: ${{ env.SWIFT_WINDOWS_ARM64_SHA256 }}

      - name: Build xcross
        shell: pwsh
        working-directory: packages/xcross
        env:
          XCROSS_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'unreleased' }}
          XCROSS_BUILD_RELEASED: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          dart run `
            "-DXCROSS_VERSION=$env:XCROSS_BUILD_VERSION" `
            "-DXCROSS_RELEASED=$env:XCROSS_BUILD_RELEASED" `
            -DXCROSS_BUNDLE_MACROS=true `
            tool/build_xcross.dart

      - name: Smoke-test bundled OpenAppleMacrosServer
        shell: bash
        run: bash .github/scripts/smoke_open_apple_macros.sh "packages/xcross/build/cli/${{ matrix.cli-dir }}/bundle"

      - name: Compile binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = "packages/xcross/build/cli/${{ matrix.cli-dir }}/bundle"
          if (-not (Test-Path "$bundle/bin/xcross.exe")) {
            throw "Missing $bundle; build produced: $(Get-ChildItem packages/xcross/build/cli -Name)"
          }
          Copy-Item -Recurse "$bundle/bin" dist/bin
          Copy-Item -Recurse "$bundle/lib" dist/lib

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force dist/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item LICENSE dist/LICENSE
          Copy-Item `
            packages/apple_developer_kit/ADI_LICENSE `
            dist/THIRD_PARTY_LICENSES/provision-dart.txt
          Copy-Item `
            third_party/OpenAppleMacros/LICENSE.md `
            dist/THIRD_PARTY_LICENSES/OpenAppleMacros.txt
          # The bundled server statically includes swift-syntax and, on
          # Windows, ships the Swift runtime DLLs: both Apache 2.0 with the
          # Runtime Library Exception.
          Invoke-WebRequest `
            https://raw.githubusercontent.com/swiftlang/swift/main/LICENSE.txt `
            -OutFile dist/THIRD_PARTY_LICENSES/swift.txt
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset }}.zip"

      - name: Smoke-test Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive "${{ matrix.asset }}.zip" smoke
          $required = @(
            'LICENSE'
            'THIRD_PARTY_LICENSES/OpenAppleMacros.txt'
            'THIRD_PARTY_LICENSES/provision-dart.txt'
            'THIRD_PARTY_LICENSES/swift.txt'
            'bin/xcross.exe'
            'bin/xcrun.exe'
            'lib/OpenAppleMacrosServer.exe'
            'lib/swiftCore.dll'
            'lib/sysv_abi_bridge.dll'
          ) | Sort-Object
          $root = Resolve-Path smoke
          $actual = Get-ChildItem smoke -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          } | Sort-Object
          $missing = $required | Where-Object { $_ -notin $actual }
          if ($missing) { throw "Archive is missing: $missing" }
          # Anything beyond the required set must be a Swift runtime DLL the
          # bundled server loads from lib/.
          $extra = $actual | Where-Object { $_ -notin $required }
          $unexpected = $extra | Where-Object { $_ -notmatch '^lib/[^/]+\.dll$' }
          if ($unexpected) { throw "Unexpected archive contents: $unexpected" }

          # IMAGE_FILE_HEADER.Machine: 0x8664 is x64, 0xAA64 is ARM64.
          $expectedMachine = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.architecture }}']
          foreach ($binary in $actual | Where-Object { $_ -match '\.(exe|dll)$' }) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $root $binary))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expectedMachine) {
              throw ('{0} targets machine 0x{1:X4}, expected 0x{2:X4}' -f
                $binary, $machine, $expectedMachine)
            }
          }

          & smoke/bin/xcross.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'xcross.exe --help failed' }

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.1
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ matrix.asset }}.zip

      - name: Upload Windows artifact
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download binaries
        # v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      # Gate: refuse to publish anything that is not provably the output of
      # this workflow, built from this commit. A hand-uploaded or swapped
      # artifact has no matching attestation and fails here.
      - name: Verify build provenance of downloaded artifacts
        env:
          SOURCE_DIGEST: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          for asset in \
            xcross-linux-x64.tar.gz \
            xcross-linux-arm64.tar.gz \
            xcross-windows-x64.zip \
            xcross-windows-arm64.zip; do
            echo "==> verifying $asset"
            gh attestation verify "dist/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$SOURCE_DIGEST" \
              --source-ref "$SOURCE_REF" \
              --deny-self-hosted-runners
          done

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            xcross-linux-x64.tar.gz \
            xcross-linux-arm64.tar.gz \
            xcross-windows-x64.zip \
            xcross-windows-arm64.zip >SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create and publish release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          cat >notes.md <<EOF
          ### Verifying this release

          Every archive below carries a signed SLSA build provenance
          attestation binding it to commit \`$GITHUB_SHA\` and to this
          repository's release workflow:

          \`\`\`sh
          gh attestation verify xcross-linux-x64.tar.gz \\
            --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\
            --source-digest $GITHUB_SHA
          \`\`\`

          \`SHA256SUMS.txt\` covers the same archives for plain integrity
          checks.
          EOF
          gh release create "$tag" \
            dist/xcross-linux-x64.tar.gz \
            dist/xcross-linux-arm64.tar.gz \
            dist/xcross-windows-x64.zip \
            dist/xcross-windows-arm64.zip \
            dist/SHA256SUMS.txt \
            packages/apple_developer_kit/ADI_LICENSE \
            --title "$tag" \
            --notes-file notes.md \
            --generate-notes
