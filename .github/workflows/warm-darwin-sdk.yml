# warm-darwin-sdk.yml
#
# PURPOSE:
#   One-time / on-demand workflow to seed the darwin.artifactbundle cache so
#   integration tests can run without hitting cold-start failures.
#
# USAGE:
#   1. Set repo secret DARWIN_ARTIFACTBUNDLE_URL to a URL pointing at a
#      .tar.gz that contains darwin.artifactbundle/ at its root:
#
#        tar -czf darwin.artifactbundle.tar.gz \
#          -C ~/.swiftpm/swift-sdks darwin.artifactbundle
#        # Upload to an accessible URL (e.g. private GCS bucket, release asset)
#        # Set Actions secret: DARWIN_ARTIFACTBUNDLE_URL=https://<host>/...tar.gz
#
#   2. Go to Actions → "Warm Darwin SDK cache" → Run workflow.
#
#   3. After this job completes, the cache key `darwin-artifactbundle-v1` is
#      warm and integration tests will hit it on every subsequent run.
#
# NOTES:
#   - Re-run whenever the SDK changes (bump cache key version in both this file
#     and integration.yml + setup-darwin-sdk/action.yml).
#   - This workflow never modifies code — safe to run from any branch.

name: Warm Darwin SDK cache

on:
  workflow_dispatch:

jobs:
  warm-cache:
    name: Download and cache darwin.artifactbundle
    runs-on: ubuntu-24.04
    env:
      DARWIN_ARTIFACTBUNDLE_URL: ${{ secrets.DARWIN_ARTIFACTBUNDLE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate secret is set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DARWIN_ARTIFACTBUNDLE_URL:-}" ]]; then
            echo "::error::Repo secret DARWIN_ARTIFACTBUNDLE_URL is not set."
            echo "Set it to a .tar.gz URL containing darwin.artifactbundle/ at its root."
            exit 1
          fi
          echo "DARWIN_ARTIFACTBUNDLE_URL is set (value redacted)."

      - name: Download darwin.artifactbundle
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Download darwin.artifactbundle"
          mkdir -p ~/.swiftpm/swift-sdks
          curl -fSL "${DARWIN_ARTIFACTBUNDLE_URL}" -o /tmp/darwin.artifactbundle.tar.gz
          echo "Download complete. Verifying archive ..."
          tar -tzf /tmp/darwin.artifactbundle.tar.gz | grep "info.json" || {
            echo "::error::Archive does not appear to contain darwin.artifactbundle/info.json"
            exit 1
          }
          echo "Extracting ..."
          tar -xzf /tmp/darwin.artifactbundle.tar.gz -C ~/.swiftpm/swift-sdks/
          rm /tmp/darwin.artifactbundle.tar.gz
          echo "Extracted:"
          ls -la ~/.swiftpm/swift-sdks/darwin.artifactbundle/
          echo "::endgroup::"

      - name: Verify info.json
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.swiftpm/swift-sdks/darwin.artifactbundle/info.json" || {
            echo "::error::info.json missing after extraction"
            exit 1
          }
          echo "info.json OK"

      - name: Save darwin.artifactbundle to cache
        uses: actions/cache/save@v4
        with:
          path: ~/.swiftpm/swift-sdks/darwin.artifactbundle
          key: darwin-artifactbundle-v1
