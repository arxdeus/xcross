name: provision_dart
description: >-
  Dart port of Provision's ADI (Apple Device Identity) provisioning client
  (Anisette/GrandSlam auth plumbing for Apple ID login), ported from
  github.com/Dadoum/Provision.
version: 0.1.0
homepage: https://github.com/Dadoum/Provision
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.3
  ffi: ^2.1.3
  http: ^1.2.2
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
