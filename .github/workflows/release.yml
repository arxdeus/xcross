name: Release xcross

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: xcross-linux-x64
          - runner: ubuntu-24.04-arm
            asset: xcross-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: |
          dart test
          dart test packages/cli_kit
          dart test packages/apple_developer_kit
          dart test packages/darwin_sdk_kit
          dart test packages/dart_mobile_device
          dart test packages/xcross_flutter
          dart test packages/xcross_dap

      - name: Compile binary
        run: |
          dart build cli -t bin/xcross.dart
          mkdir -p dist
          # Bundle layout is bin/ + lib/ (native assets). Ship as tar.gz.
          tar -C build/cli/*/bundle -czf "dist/${{ matrix.asset }}.tar.gz" bin lib

      - name: Upload binary artifacts
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build xcross-windows-x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Verify Dart code
        run: |
          dart pub get
          dart analyze
          dart test
          dart test packages/cli_kit
          dart test packages/apple_developer_kit
          dart test packages/darwin_sdk_kit
          dart test packages/dart_mobile_device
          dart test packages/xcross_flutter
          dart test packages/xcross_dap

      - name: Build xcross
        shell: pwsh
        run: |
          dart build cli -t bin/xcross.dart
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/cli/windows_x64/bundle/bin dist/bin
          Copy-Item -Recurse build/cli/windows_x64/bundle/lib dist/lib

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force dist/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item LICENSE dist/LICENSE
          Copy-Item `
            packages/apple_developer_kit/ADI_LICENSE `
            dist/THIRD_PARTY_LICENSES/provision-dart.txt
          Copy-Item `
            native/signing/ZSIGN_LICENSE.txt `
            dist/THIRD_PARTY_LICENSES/zsign.txt
          Compress-Archive -Path dist/* -DestinationPath xcross-windows-x64.zip

      - name: Smoke-test Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive xcross-windows-x64.zip smoke
          $expected = @(
            'LICENSE'
            'THIRD_PARTY_LICENSES/provision-dart.txt'
            'THIRD_PARTY_LICENSES/zsign.txt'
            'bin/xcross.exe'
            'lib/sysv_abi_bridge.dll'
          ) | Sort-Object
          $root = Resolve-Path smoke
          $actual = Get-ChildItem smoke -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          } | Sort-Object
          if (Compare-Object $expected $actual) {
            throw "Unexpected archive contents: $actual"
          }

          & smoke/bin/xcross.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'xcross.exe --help failed' }

      - name: Upload Windows artifact
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcross-windows-x64
          path: xcross-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download binaries
        # v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - name: Create and publish release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          gh release create "$tag" \
            dist/xcross-linux-x64.tar.gz \
            dist/xcross-linux-arm64.tar.gz \
            dist/xcross-windows-x64.zip \
            native/signing/ZSIGN_LICENSE.txt \
            packages/apple_developer_kit/ADI_LICENSE \
            --title "$tag" \
            --generate-notes
