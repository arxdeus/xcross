name: Nix

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml
      - README.md
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build and run xcross
        run: |
          nix build .#xcross --print-build-logs
          nix run . -- --help | grep -F "Usage: xcross"
          nix run . -- --version | grep -F "xcross 1.3.2"

      - name: Probe development tools
        run: |
          nix develop --command bash -euo pipefail -c '
            for tool in xcross xcrun flutter swift swiftc clang clang++ llvm-ar ld64.lld python3 pymobiledevice3 usbmuxd idevice_id pkg-config gpg; do
              command -v "$tool"
            done
            xcross --help | grep -F "Usage: xcross"
            xcross --version | grep -F "xcross 1.3.2"
          '

      - name: Verify Dart workspace
        run: |
          nix develop .#contributor --command bash -euo pipefail -c '
            dart pub get
            dart analyze
            dart test packages/xcross
            dart test packages/cli_kit
            dart test packages/apple_developer_kit
            dart test packages/darwin_sdk_kit
            dart test packages/dart_mobile_device
            dart test packages/frontend_server_kit
          '
