# Seeds the private, per-host Darwin SDK caches used by integration.yml.
# The input archive must contain xcross-darwin.artifactbundle at its root and
# should be produced locally by `xcross sdk install <Xcode.xip>`. Never publish
# the archive: it contains Apple SDK content.
name: Warm Darwin SDK cache

on:
  workflow_dispatch:
    inputs:
      xcross_darwin_artifactbundle_url:
        description: >-
          Private URL of a .tar.gz containing xcross-darwin.artifactbundle at
          its root
        required: true
        type: string

permissions:
  contents: read

jobs:
  warm-cache:
    name: Warm ${{ matrix.os }} cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install Linux LLVM requirements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          swift --version
          clang --version

      - name: Install official Swift and LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = @(
            'install', '--exact', '--source', 'winget', '--silent',
            '--accept-package-agreements', '--accept-source-agreements',
            '--disable-interactivity'
          )
          winget @install --id Swift.Toolchain
          winget @install --id LLVM.LLVM

          $llvmBin = "${env:ProgramFiles}\LLVM\bin"
          $machinePath = [Environment]::GetEnvironmentVariable(
            'Path', 'Machine'
          )
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$llvmBin;$machinePath;$userPath"
          $swift = Get-Command swift.exe -ErrorAction SilentlyContinue
          if (-not $swift) {
            $swift = Get-ChildItem `
              "${env:ProgramFiles}\Swift" `
              -Filter swift.exe `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $swift) {
            throw 'Swift.Toolchain did not install swift.exe'
          }
          $swiftPath = if ($swift.Source) {
            $swift.Source
          } else {
            $swift.FullName
          }
          $swiftBin = Split-Path $swiftPath
          $llvmBin |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $swiftBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$llvmBin;$swiftBin;$env:Path"
          $tools = @('swift', 'clang', 'clang++', 'llvm-ar', 'ld64.lld')
          foreach ($tool in $tools) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing $tool"
            }
          }

      - name: Restore or download xcross Darwin SDK
        uses: ./.github/actions/setup-darwin-sdk
        with:
          artifactbundle-url: ${{ inputs.xcross_darwin_artifactbundle_url }}
