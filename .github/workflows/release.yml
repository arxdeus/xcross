name: Release xcross

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: xcross-linux-x64
          - runner: ubuntu-24.04-arm
            asset: xcross-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Compile binary
        run: |
          mkdir -p dist
          dart compile exe bin/xcross.dart -o "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Upload binary artifacts
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-windows:
    name: Build xcross-windows-x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Verify Dart code
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Build xcross and AOSKit bridge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          dart compile exe bin/xcross.dart -o dist/xcross.exe
          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsArgs = @(
            '-latest', '-products', '*',
            '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '-property', 'installationPath'
          )
          $vs = & $vswhere @vsArgs
          if (-not $vs) {
            throw 'Visual Studio C++ tools were not found'
          }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $cl = @(
            'cl', '/nologo', '/O2', '/MT', '/EHsc', '/std:c++17',
            '/W4', '/WX', '/DUNICODE', '/D_UNICODE',
            'native\windows\aoskit_helper.cpp',
            '/Fe:dist\xcross-aoskit.exe'
          ) -join ' '
          $command = "call `"$vcvars`" x86 && $cl"
          cmd.exe /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force dist/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item LICENSE dist/LICENSE
          Copy-Item `
            native/windows/AOSKIT_HELPER_LICENSE.txt `
            dist/THIRD_PARTY_LICENSES/aoskit-helper.txt
          Copy-Item `
            native/signing/ZSIGN_LICENSE.txt `
            dist/THIRD_PARTY_LICENSES/zsign.txt
          Compress-Archive -Path dist/* -DestinationPath xcross-windows-x64.zip

      - name: Smoke-test Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive xcross-windows-x64.zip smoke
          $expected = @(
            'LICENSE'
            'THIRD_PARTY_LICENSES/aoskit-helper.txt'
            'THIRD_PARTY_LICENSES/zsign.txt'
            'xcross-aoskit.exe'
            'xcross.exe'
          ) | Sort-Object
          $root = Resolve-Path smoke
          $actual = Get-ChildItem smoke -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          } | Sort-Object
          if (Compare-Object $expected $actual) {
            throw "Unexpected archive contents: $actual"
          }

          & smoke/xcross.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'xcross.exe --help failed' }

          $helper = Start-Process `
            (Resolve-Path 'smoke\xcross-aoskit.exe') `
            -RedirectStandardError helper-error.txt `
            -PassThru `
            -Wait
          $diagnostic = Get-Content helper-error.txt -Raw
          $expectedDiagnostic = (
            'Could not (find Apple support|' +
            'find Apple Internet Services|' +
            'register Apple DLL directories|' +
            'load Apple Application Support objc\.dll)'
          )
          if ($helper.ExitCode -ne 2 -or
              $diagnostic -notmatch $expectedDiagnostic) {
            throw "Unexpected AOSKit helper result: $diagnostic"
          }

      - name: Upload Windows artifact
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcross-windows-x64
          path: xcross-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download binaries
        # v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - name: Create and publish release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          gh release create "$tag" \
            dist/xcross-linux-x64 \
            dist/xcross-linux-arm64 \
            dist/xcross-windows-x64.zip \
            native/signing/ZSIGN_LICENSE.txt \
            --title "$tag" \
            --generate-notes
