name: Architecture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up pinned Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: 3.13.0
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Test architecture guard
        run: dart --packages=.dart_tool/package_config.json tool/architecture/check_test.dart
      - name: Enforce production architecture
        run: dart --packages=.dart_tool/package_config.json tool/architecture/check.dart > architecture-report.json
      - name: Test CI security and headless smoke helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Upload architecture inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-inventory
          path: architecture-report.json
          if-no-files-found: error
          retention-days: 7
