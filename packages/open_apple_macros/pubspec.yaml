name: open_apple_macros
description: >-
  Build and cache an open-source Swift macro plugin server for Apple-only
  macro modules (SwiftUI, Previews, FoundationModels) on any Swift host.
version: 1.0.0
repository: https://github.com/arxdeus/xcross
homepage: https://github.com/arxdeus/xcross
topics:
  - swift
  - macros
  - ios

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  cli_kit: ^1.0.0
  crypto: ^3.0.7
  embed_annotation: ^1.2.3
  meta: ^1.19.0
  path: ^1.9.1
dev_dependencies:
  build_runner: ^2.16.1
  embed: ^1.6.6
  test: ^1.32.0
