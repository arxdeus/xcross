name: Setup Darwin SDK
description: >-
  Download and verify xcross-darwin.artifactbundle from a private URL
  without restoring or saving Apple SDK content in Actions caches.

inputs:
  artifactbundle-url:
    description: >-
      Private URL to a .tar.gz containing xcross-darwin.artifactbundle at its
      root. Pass the repository secret DARWIN_ARTIFACTBUNDLE_URL only in
      trusted jobs.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve xcross Swift SDK path
      shell: python
      run: |
        import os
        from pathlib import Path

        if os.name == "nt":
            config = Path(os.environ["APPDATA"])
        else:
            config = Path(
                os.environ.get("XDG_CONFIG_HOME", Path.home() / ".config")
            )
        parent = config / "xcross" / "swift-sdks"
        bundle = parent / "xcross-darwin.artifactbundle"
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"XCROSS_SWIFT_SDKS_PATH={parent}\n")
            env.write(f"XCROSS_DARWIN_BUNDLE={bundle}\n")

    - name: Download Darwin SDK
      shell: python
      env:
        DARWIN_ARTIFACTBUNDLE_URL: ${{ inputs.artifactbundle-url }}
      run: |
        import os
        import shutil
        import subprocess
        import urllib.request
        from pathlib import Path

        url = os.environ.get("DARWIN_ARTIFACTBUNDLE_URL", "").strip()
        if not url:
            print(
                "::error::Set the repository secret DARWIN_ARTIFACTBUNDLE_URL "
                "to a private SDK .tar.gz URL and pass it as artifactbundle-url "
                "from a trusted workflow. Fork pull requests must skip this action."
            )
            raise SystemExit(1)

        parent = Path(os.environ["XCROSS_SWIFT_SDKS_PATH"])
        bundle = Path(os.environ["XCROSS_DARWIN_BUNDLE"])
        archive = (
            Path(os.environ["RUNNER_TEMP"])
            / "xcross-darwin.artifactbundle.tar.gz"
        )
        parent.mkdir(parents=True, exist_ok=True)
        if bundle.exists():
            shutil.rmtree(bundle)
        print("Downloading private Darwin SDK archive...")
        try:
            try:
                with (
                    urllib.request.urlopen(url, timeout=120) as response,
                    archive.open("wb") as output,
                ):
                    shutil.copyfileobj(response, output)
            except Exception:
                print(
                    "::error::Darwin SDK download failed. Check the repository "
                    "secret DARWIN_ARTIFACTBUNDLE_URL, source availability, "
                    "and runner network access."
                )
                raise SystemExit(1) from None
            subprocess.run(
                ["tar", "-xzf", str(archive), "-C", str(parent)],
                check=True,
            )
        finally:
            archive.unlink(missing_ok=True)
        if not (bundle / "info.json").is_file():
            print(
                "::error::Archive must contain "
                "xcross-darwin.artifactbundle at its root."
            )
            raise SystemExit(1)

    - name: Refresh clang builtin headers
      shell: python
      run: |
        import os
        import shutil
        import subprocess
        from pathlib import Path

        swift_path = shutil.which("swift")
        if not swift_path:
            raise SystemExit("selected Swift executable not found on PATH")
        swift = Path(swift_path).resolve()
        clang = swift.with_name("clang.exe" if os.name == "nt" else "clang")
        if not clang.is_file():
            raise SystemExit(
                f"selected Swift executable {swift} has no sibling "
                f"clang at {clang}"
            )
        resource = Path(
            subprocess.check_output(
                [str(clang), "-print-resource-dir"], text=True
            ).strip()
        )
        source = resource / "include"
        destination = Path(os.environ["XCROSS_DARWIN_BUNDLE"]).joinpath(
            "Developer",
            "Toolchains",
            "XcodeDefault.xctoolchain",
            "usr",
            "lib",
            "swift",
            "clang",
            "include",
        )
        if not source.is_dir():
            raise SystemExit(f"clang builtin headers not found at {source}")
        if destination.is_symlink() or destination.is_file():
            destination.unlink()
        elif destination.exists():
            shutil.rmtree(destination)
        destination.parent.mkdir(parents=True, exist_ok=True)
        shutil.copytree(source, destination)

    - name: Materialize Swift compatibility resources
      shell: python
      run: |
        import os
        import shutil
        from pathlib import Path

        bundle = Path(os.environ["XCROSS_DARWIN_BUNDLE"])
        source = bundle.joinpath(
            "Developer", "Toolchains", "XcodeDefault.xctoolchain", "usr",
            "lib", "swift", "iphoneos", "layouts-arm64.yaml"
        )
        if not source.is_file() or source.stat().st_size == 0:
            raise SystemExit(
                f"missing or empty canonical Swift layout: {source}"
            )
        destination = bundle.joinpath(
            "Developer", "Runtimes", "XcodeDefault.xctoolchain", "usr",
            "bin", "layouts-arm64.yaml"
        )
        destination.parent.mkdir(parents=True, exist_ok=True)
        shutil.copyfile(source, destination)

    - name: Verify Darwin Swift SDK
      shell: python
      run: |
        import os
        import shutil
        import subprocess
        from pathlib import Path

        parent = Path(os.environ["XCROSS_SWIFT_SDKS_PATH"])
        bundle = Path(os.environ["XCROSS_DARWIN_BUNDLE"])
        for name in ("info.json", "swift-sdk.json"):
            if not (bundle / name).is_file():
                raise SystemExit(f"missing {bundle / name}")
        command = ["swift", "sdk", "list", "--swift-sdks-path", str(parent)]
        completed = subprocess.run(command, check=False)
        if completed.returncode:
            # A bare NTSTATUS here means swift.exe could not load its DLLs.
            print(f"::error::{' '.join(command)} exited {completed.returncode}")
            print(f"swift: {shutil.which('swift')}")
            print("PATH:")
            for entry in os.environ["PATH"].split(os.pathsep):
                print(f"  {entry}")
            raise SystemExit(completed.returncode)
