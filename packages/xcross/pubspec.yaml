name: xcross
description: >-
  Build, run, and hot-reload Flutter iOS apps natively from Linux and Windows
  with official Swift and LLVM toolchains and no xtool runtime.
version: 2.0.0
repository: https://github.com/arxdeus/xcross
homepage: https://github.com/arxdeus/xcross
topics:
  - ios
  - flutter
  - cli
  - cross-compilation

environment:
  sdk: ^3.10.0

resolution: workspace

executables:
  xcross:
  xcrun:

dependencies:
  apple_developer_kit: ^1.0.0
  archive: ^4.3.0
  args: ^2.7.0
  async: ^2.13.1
  basic_utils: ^5.8.2
  build_cli_annotations: ^2.1.1
  cli_kit: ^1.0.0
  cli_util: ^0.6.0
  completion: ^1.0.2
  crypto: ^3.0.7
  dart_mobile_device: ^1.0.0
  darwin_sdk_kit: ^1.0.0
  dds: ^5.4.0
  embed_annotation: ^1.2.3
  ffi: ^2.2.0
  frontend_server_kit: ^1.0.0
  http: ^1.6.0
  meta: ^1.19.0
  package_config: ^3.0.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  propertylistserialization: ^1.5.0
  pub_semver: ^2.2.0
  pure: ^1.0.0
  standard_message_codec: ^0.0.1+5
  vm_service: ^15.3.0
  web_socket_channel: ^3.0.3
  xml: ^7.1.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  analyzer: 13.3.0
  build_cli: ^2.2.13
  build_runner: ^2.16.1
  embed: ^1.7.1
  test: ^1.32.0
